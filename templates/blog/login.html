{% extends "home/base.html" %}

{% block index %}
<main class="bg-zinc-50 py-16 md:py-24">
  <section class="max-w-md mx-auto px-6">
    <div class="bg-white rounded-2xl border border-zinc-100 p-6 md:p-8 shadow-sm">
      <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center mb-5"><i class="ri-login-box-line text-xl" aria-hidden="true"></i></div>
      <h1 class="text-3xl font-bold text-zinc-900 mb-2">خوش برگشتی</h1>
      <p class="text-sm text-zinc-500 mb-8">برای ادامه وارد حساب کاربری‌ات شو.</p>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <label class="block text-sm font-medium text-zinc-700" for="username">نام کاربری</label>
        <input id="username" type="text" name="username" required autocomplete="username" class="w-full rounded-lg border border-zinc-200 px-4 py-3 outline-none focus:border-amber-400">
        <label class="block text-sm font-medium text-zinc-700" for="password">رمز عبور</label>
        <input id="password" type="password" name="password" required autocomplete="current-password" class="w-full rounded-lg border border-zinc-200 px-4 py-3 outline-none focus:border-amber-400">
        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-zinc-900 text-white px-5 py-3 text-sm font-medium hover:bg-amber-500 hover:text-zinc-900 transition-colors">
          ورود <i class="ri-arrow-left-line" aria-hidden="true"></i>
        </button>
      </form>
      <p class="text-sm text-zinc-500 mt-6 text-center">حساب نداری؟ <a href="{% url 'blog:register' %}" class="text-amber-600 font-medium hover:text-amber-700">ثبت‌نام کن</a></p>
    </div>
  </section>
</main>
{% endblock index %}
