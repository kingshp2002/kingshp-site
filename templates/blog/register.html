{% extends "home/base.html" %}

{% block index %}
<main class="bg-zinc-50 py-16 md:py-24">
  <section class="max-w-md mx-auto px-6">
    <div class="bg-white rounded-2xl border border-zinc-100 p-6 md:p-8 shadow-sm">
      <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center mb-5"><i class="ri-user-add-line text-xl" aria-hidden="true"></i></div>
      <h1 class="text-3xl font-bold text-zinc-900 mb-2">ساخت حساب</h1>
      <p class="text-sm text-zinc-500 mb-8">به جمع نویسندگان و خوانندگان وبلاگ بپیوند.</p>
      <form method="post" class="space-y-4 [&_p]:space-y-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_label]:text-zinc-700 [&_input]:w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-zinc-200 [&_input]:px-4 [&_input]:py-3 [&_input]:outline-none [&_input]:focus:border-amber-400">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-zinc-900 text-white px-5 py-3 text-sm font-medium hover:bg-amber-500 hover:text-zinc-900 transition-colors">
          ثبت‌نام <i class="ri-arrow-left-line" aria-hidden="true"></i>
        </button>
      </form>
      <p class="text-sm text-zinc-500 mt-6 text-center">قبلاً ثبت‌نام کرده‌ای؟ <a href="{% url 'blog:login' %}" class="text-amber-600 font-medium hover:text-amber-700">وارد شو</a></p>
    </div>
  </section>
</main>
{% endblock index %}
